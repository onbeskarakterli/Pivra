[package]
name = "pivra"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight GNOME image viewer with seamless photo and video navigation"
repository = "https://github.com/onbeskarakterli/Pivra"
publish = false

# Glycin 3.0 gdk integration requires native GTK >= 4.16; libadwaita >= 1.2.
[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_2"] }

glycin = { version = "=3.0.8", features = ["gdk4"] }

[dev-dependencies]
tempfile = "3"
