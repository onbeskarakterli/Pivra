[package]
name = "pivra"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight GNOME image viewer with seamless photo and video navigation"
repository = "https://github.com/onbeskarakterli/Pivra"
publish = false

# GTK 4.6 / libadwaita 1.2 API baseline; use native distribution libraries.
[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_2"] }

[dev-dependencies]
tempfile = "3"
